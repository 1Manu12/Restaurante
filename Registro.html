<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sabores del vino</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="img/Gemini_Generated_Image_xxuqwjxxuqwjxxuq-removebg-preview.png"
    />
  </head>
  <body class="Inicio">
    <header class="Header">
      <div class="container nav">
        <div class="imglogo">
          <img
            src="img/Gemini_Generated_Image_xxuqwjxxuqwjxxuq-removebg-preview.png"
            alt="Abuela"
            width="60px"
            height="60px"
          />
        </div>
        <div class="logo">Sabores del vino</div>
        <nav>
          <a href="Iniciarseccion.html" class="btn-login">Iniciar sesión</a>
        </nav>
      </div>
    </header>

    <section class="I">
      <div class="header">
        <img
          src="img/Gemini_Generated_Image_xxuqwjxxuqwjxxuq-removebg-preview.png"
          alt="Logo Sabores del Vino"
          width="250px"
        />
      </div>

      <div class="form-body">
        <h1>Crea tu cuenta</h1>
        <form id="registerForm">
          <label>Nombre Completo</label>
          <input
            type="text"
            id="nombreReg"
            placeholder="Nombre completo"
            required
          /><br />

          <label>Correo Electrónico</label>
          <input
            type="email"
            id="emailReg"
            placeholder="Correo Electrónico"
            required
          /><br />

          <label>Contraseña</label>
          <input
            type="password"
            id="passReg"
            placeholder="Contraseña"
            required
          /><br />

          <label>Confirmar Contraseña</label>
          <input
            type="password"
            id="passConfirmReg"
            placeholder="Repite tu contraseña"
            required
          /><br />

          <button type="submit" class="btn-entrar">REGISTRARSE</button>
        </form>

        <div class="divisor">O</div>

        <button class="btn-social" id="googleLogin">Regístrate con Google</button>
        <button class="btn-social">Regístrate con Facebook</button>

        <p>
          ¿Ya tienes cuenta?
          <a href="Iniciarseccion.html">Inicia sesión aquí.</a>
        </p>
      </div>
    </section>
    <script type="module" src="JS/firebase-config.js"></script>
        <script type="module" src="JS/registro.js"></script>
  </body>
</html>
